# Builds the Drovox iPhone app (drovox/mobile/ios) on a GitHub macOS machine — no Mac needed.
#  • Every push that changes drovox/mobile → Drovox-unsigned.ipa (install on your iPhone from Windows with Sideloadly).
#  • Run manually with "TestFlight" ticked → signed build uploaded to App Store Connect / TestFlight.
# Secrets for TestFlight (Apple Developer Program account):
#   APPLE_TEAM_ID                   10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID / ASC_ISSUER_ID       App Store Connect → Users and Access → Integrations → App Store Connect API (role: Admin or App Manager)
#   ASC_KEY_P8                       contents of the downloaded AuthKey_XXXX.p8 file
#   DROVOX_URL                       live store URL (else app.config.json)
name: Drovox iOS app

on:
  push:
    paths: ['drovox/mobile/**', '.github/workflows/drovox-ios.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Sign and upload to TestFlight (needs the Apple secrets)'
        type: boolean
        default: false
      site_url:
        description: 'Site the app opens (blank = DROVOX_URL secret or app.config.json). For a test build use your laptop, e.g. http://192.168.1.5:3000'
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: drovox/mobile
    env:
      DROVOX_URL: ${{ inputs.site_url || secrets.DROVOX_URL }}
      BUILD_NO: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: drovox/mobile/package-lock.json
      - name: Install
        run: npm ci
      - name: Configure site URL and sync Capacitor
        run: npm run sync:ios
      - name: Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA (for Sideloadly / AltStore)
        if: github.event_name != 'workflow_dispatch' || !inputs.testflight
        run: |
          VERSION=$(node -p "require('./app.config.json').versionName")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Drovox.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NO" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive | tail -40
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Drovox.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Drovox-unsigned.ipa" Payload)
          ls -la "$GITHUB_WORKSPACE/Drovox-unsigned.ipa"

      - name: Build, sign and upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.testflight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [ -n "${!v}" ] || { echo "::error::Add the $v secret"; exit 1; }; done
          KEY="$RUNNER_TEMP/AuthKey.p8"; printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          VERSION=$(node -p "require('./app.config.json').versionName")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Drovox.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NO" "${AUTH[@]}" archive | tail -40
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          sed -i '' 's/^          //' "$RUNNER_TEMP/export.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Drovox.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -40
          echo "Uploaded build $BUILD_NO to App Store Connect — it appears in TestFlight after Apple's processing (10–30 min)."

      - uses: actions/upload-artifact@v5
        if: github.event_name != 'workflow_dispatch' || !inputs.testflight
        with:
          name: drovox-ios-${{ github.run_number }}
          path: Drovox-unsigned.ipa
          if-no-files-found: error
