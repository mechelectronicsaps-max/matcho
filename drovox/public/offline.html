<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Drovox — offline</title>
<style>html,body{margin:0;height:100%;background:#3A2CB2;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}main{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
.m{width:76px;height:76px;border-radius:20px;background:#F25C05;display:grid;place-items:center;font-weight:800;font-size:40px;margin:0 auto 18px}p{color:#d9d4ff}button{background:#F25C05;color:#fff;border:0;border-radius:12px;padding:14px 28px;font-size:1rem;font-weight:700}</style></head>
<body><main><div><div class="m">D</div><h1>You're offline</h1><p>Check your mobile data or Wi-Fi, then try again.</p><button onclick="location.reload()">Try again</button></div></main>
<script>addEventListener('online', () => location.reload());</script></body></html>
